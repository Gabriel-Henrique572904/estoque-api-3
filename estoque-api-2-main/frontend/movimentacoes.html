<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque API - Movimentações</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #2c3e50; }
        .sidebar { height: 100vh; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; width: 250px; padding-top: 20px; }
        .sidebar a { color: #6c757d; text-decoration: none; padding: 15px 20px; display: block; font-weight: 500; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #e9ecef; color: #0d6efd; border-left: 4px solid #0d6efd; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div class="sidebar">
    <h4 class="px-4 mb-4 text-primary fw-bold"><i class="bi bi-box-seam"></i> EstoquePro</h4>
    <a href="index.html" class="active"><i class="bi bi-grid me-2"></i> Dashboard</a>
    <a href="categorias.html"><i class="bi bi-tags me-2"></i> Categorias</a>
    <a href="produtos.html"><i class="bi bi-box me-2"></i> Produtos</a>
    <a href="movimentacoes.html"><i class="bi bi-arrow-left-right me-2"></i> Movimentações</a>
    </div>


    <!-- Conteúdo Principal -->
    <div class="main-content">
        <h2 class="fw-bold mb-4">Registar Movimentação de Stock</h2>

        <div class="row">
            <div class="col-md-6">
                <div class="card card-custom p-4">
                    <form id="form-mov">
                        <div class="mb-3">
                            <label class="form-label">ID do Produto</label>
                            <input type="number" id="produto_id" class="form-control" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Movimentação</label>
                            <select id="tipo" class="form-select" required>
                                <option value="ENTRADA">ENTRADA (Adicionar ao stock)</option>
                                <option value="SAIDA">SAÍDA (Retirar do stock)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade</label>
                            <input type="number" id="quantidade" class="form-control" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Observação</label>
                            <input type="text" id="observacao" class="form-control" placeholder="Ex: Compra de fornecedor / Venda">
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check2-circle"></i> Registar Operação</button>
                        <div id="alerta-mov" class="mt-3"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        document.getElementById('form-mov').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alerta = document.getElementById('alerta-mov');
            
            const payload = {
                produto_id: parseInt(document.getElementById('produto_id').value),
                tipo: document.getElementById('tipo').value,
                quantidade: parseInt(document.getElementById('quantidade').value),
                observacao: document.getElementById('observacao').value || null
            };

            try {
                const res = await fetch(`${API_BASE_URL}/movimentacoes/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    alerta.innerHTML = '<div class="alert alert-success py-2">Movimentação registada com sucesso!</div>';
                    document.getElementById('form-mov').reset();
                } else {
                    const errData = await res.json();
                    alerta.innerHTML = `<div class="alert alert-danger py-2">Erro: ${errData.detail || 'Verifique os dados'}</div>`;
                }
            } catch {
                alerta.innerHTML = '<div class="alert alert-danger py-2">Erro de conexão com o servidor.</div>';
            }
            setTimeout(() => alerta.innerHTML = '', 4000);
        });
    </script>
</body>
</html>
