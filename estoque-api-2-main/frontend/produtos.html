<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque API - Produtos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #2c3e50; }
        .sidebar { height: 100vh; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; width: 250px; padding-top: 20px; }
        .sidebar a { color: #6c757d; text-decoration: none; padding: 15px 20px; display: block; font-weight: 500; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #e9ecef; color: #0d6efd; border-left: 4px solid #0d6efd; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

    <div class="sidebar">
    <h4 class="px-4 mb-4 text-primary fw-bold"><i class="bi bi-box-seam"></i> EstoquePro</h4>
    <a href="index.html" class="active"><i class="bi bi-grid me-2"></i> Dashboard</a>
    <a href="categorias.html"><i class="bi bi-tags me-2"></i> Categorias</a>
    <a href="produtos.html"><i class="bi bi-box me-2"></i> Produtos</a>
    <a href="movimentacoes.html"><i class="bi bi-arrow-left-right me-2"></i> Movimentações</a>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <h2 class="fw-bold mb-4">Gerenciar Produtos</h2>

        <div class="row g-4">
            <!-- Formulário de Cadastro -->
            <div class="col-md-4">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-3">Novo Produto</h5>
                    <form id="form-produto">
                        <div class="mb-3">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade Inicial</label>
                            <input type="number" id="quantidade" class="form-control" required min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ID da Categoria</label>
                            <input type="number" id="categoria_id" class="form-control" required min="1">
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Salvar Produto</button>
                        <div id="mensagem-alerta" class="mt-3"></div>
                    </form>
                </div>
            </div>

            <!-- Tabela de Listagem -->
            <div class="col-md-8">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-3">Estoque Atual</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Quantidade</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-produtos">
                                <!-- Os produtos serão injetados aqui via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de Comunicação com a API -->
    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        // Função para listar os produtos na tabela
        async function carregarProdutos() {
            const tbody = document.getElementById('tabela-produtos');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">A carregar dados...</td></tr>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/produtos/`);
                if (!response.ok) throw new Error("Erro ao buscar produtos");
                
                const produtos = await response.json();
                tbody.innerHTML = '';
                
                if(produtos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhum produto cadastrado.</td></tr>';
                    return;
                }

                produtos.forEach(p => {
                    // Feedback visual para estoque crítico (exigência do CP2)
                    const badgeEstoque = p.quantidade < 10 
                        ? `<span class="badge bg-danger">${p.quantidade} (Crítico)</span>` 
                        : `<span class="badge bg-success">${p.quantidade}</span>`;

                    tbody.innerHTML += `
                        <tr>
                            <td>#${p.id || '-'}</td>
                            <td class="fw-bold">${p.nome}</td>
                            <td>${badgeEstoque}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro de conexão com a API.</td></tr>';
            }
        }

        // Função para cadastrar novo produto
        document.getElementById('form-produto').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita recarregar a página
            const alerta = document.getElementById('mensagem-alerta');
            
            const novoProduto = {
                nome: document.getElementById('nome').value,
                quantidade: parseInt(document.getElementById('quantidade').value),
                categoria_id: parseInt(document.getElementById('categoria_id').value)
            };

            try {
                const response = await fetch(`${API_BASE_URL}/produtos/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoProduto)
                });

                if (response.ok) {
                    alerta.innerHTML = '<div class="alert alert-success py-2">Produto salvo com sucesso!</div>';
                    document.getElementById('form-produto').reset(); // Limpa o formulário
                    carregarProdutos(); // Atualiza a tabela
                } else {
                    alerta.innerHTML = '<div class="alert alert-danger py-2">Erro ao salvar. Verifique os dados.</div>';
                }
            } catch (error) {
                alerta.innerHTML = '<div class="alert alert-danger py-2">Erro de comunicação com o servidor.</div>';
            }
            
            // Remove o alerta após 3 segundos
            setTimeout(() => { alerta.innerHTML = ''; }, 3000);
        });

        // Carrega a tabela assim que a página abre
        carregarProdutos();
    </script>
</body>
</html>
