<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque API - Categorias</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #2c3e50; }
        .sidebar { height: 100vh; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; width: 250px; padding-top: 20px; }
        .sidebar a { color: #6c757d; text-decoration: none; padding: 15px 20px; display: block; font-weight: 500; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #e9ecef; color: #0d6efd; border-left: 4px solid #0d6efd; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

    <div class="sidebar">
    <h4 class="px-4 mb-4 text-primary fw-bold"><i class="bi bi-box-seam"></i> EstoquePro</h4>
    <a href="index.html" class="active"><i class="bi bi-grid me-2"></i> Dashboard</a>
    <a href="categorias.html"><i class="bi bi-tags me-2"></i> Categorias</a>
    <a href="produtos.html"><i class="bi bi-box me-2"></i> Produtos</a>
    <a href="movimentacoes.html"><i class="bi bi-arrow-left-right me-2"></i> Movimentações</a>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <h2 class="fw-bold mb-4">Gerenciar Categorias</h2>

        <div class="row g-4">
            <!-- Formulário -->
            <div class="col-md-4">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-3">Nova Categoria</h5>
                    <form id="form-categoria">
                        <div class="mb-3">
                            <label class="form-label">Nome da Categoria</label>
                            <input type="text" id="nome-categoria" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Salvar Categoria</button>
                        <div id="alerta-categoria" class="mt-3"></div>
                    </form>
                </div>
            </div>

            <!-- Tabela -->
            <div class="col-md-8">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-3">Categorias Cadastradas</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-categorias">
                                <tr><td colspan="2" class="text-center">A carregar...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        async function carregarCategorias() {
            const tbody = document.getElementById('tabela-categorias');
            try {
                const res = await fetch(`${API_BASE_URL}/categorias/`);
                if (!res.ok) throw new Error();
                const dados = await res.json();
                
                tbody.innerHTML = '';
                if(dados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Nenhuma categoria registada.</td></tr>';
                    return;
                }
                dados.forEach(c => {
                    tbody.innerHTML += `<tr><td>#${c.id}</td><td class="fw-bold">${c.nome}</td></tr>`;
                });
            } catch {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Erro ao carregar dados.</td></tr>';
            }
        }

        document.getElementById('form-categoria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome-categoria').value;
            const alerta = document.getElementById('alerta-categoria');

            try {
                const res = await fetch(`${API_BASE_URL}/categorias/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome })
                });
                if(res.ok) {
                    alerta.innerHTML = '<div class="alert alert-success py-2">Categoria salva!</div>';
                    document.getElementById('form-categoria').reset();
                    carregarCategorias();
                } else {
                    alerta.innerHTML = '<div class="alert alert-danger py-2">Erro ao guardar.</div>';
                }
            } catch {
                alerta.innerHTML = '<div class="alert alert-danger py-2">Erro de conexão.</div>';
            }
            setTimeout(() => alerta.innerHTML = '', 3000);
        });

        carregarCategorias();
    </script>
</body>
</html>
